<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion Pro - Z-BrD DeV | 22 métiers</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:#f4f6f9;color:#101828}
header{background:#0f2040;color:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px}
.logo{font-weight:900;font-size:19px;color:#f5c518;line-height:1}.logo span{display:block;font-size:9px;color:#fff;letter-spacing:1px}
.sp{flex:1}.hbtn{border:0;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}.gold{background:#f5c518}.white{background:#fff}
.wrap{max-width:860px;margin:auto;padding:14px 14px 30px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:12px}
.hero{background:#0f2040;color:#fff;border-radius:22px;padding:22px}
.hero h1{font-size:30px;line-height:1.1;margin:8px 0}.hero p{opacity:.85;line-height:1.5}
.badge{display:inline-block;background:#f5c518;color:#111;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;margin:0 4px 4px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}.kpi{background:#fff;border-radius:16px;padding:14px;text-align:center}.kpi b{font-size:22px}.kpi span{color:#667085;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.bigbtn{border:0;border-radius:18px;padding:20px;text-align:left;cursor:pointer;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;gap:12px;align-items:center}.bigbtn b{font-size:16px;display:block}.bigbtn span{font-size:12px;color:#667085}.bigbtn.gold{background:#f5c518}.bigbtn.dark{background:#0f2040;color:#fff}.bigbtn.dark span{color:#cbd5e1}.ico{font-size:28px}
input,select,textarea{width:100%;padding:12px;border:1px solid #dbe2ec;border-radius:12px;margin:6px 0;font-size:15px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:14px}.btn.gold{background:#f5c518}.btn.dark{background:#0f2040;color:#fff}.btn.light{background:#eef2f7}.btn.red{background:#fee4e2;color:#b42318}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.item input{margin:0}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #eef1f6;border-radius:12px;margin:8px 0;background:#fff}
.tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#e6f4ea;color:#0a7a42;white-space:nowrap}.tag.warn{background:#fef0c7;color:#92400e}.tag.block{background:#fee4e2;color:#b42318}
.muted{color:#667085;font-size:13px;line-height:1.5}.pagetitle{font-size:24px;margin:6px 0 4px}.pagesub{color:#667085;font-size:13px;margin:0 0 12px;line-height:1.5}
.admin{text-align:center}.admin button{background:none;border:0;color:#98a2b3;font-size:11px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}.modal>div{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:480px}
.errbox{background:#fff3cd;border:1px solid #f5c518;border-radius:12px;padding:12px;margin:10px 0;font-size:13px;line-height:1.5}
.bottomnav{display:flex;gap:10px;margin-top:12px}.bottomnav button{flex:1}
</style></head><body>
<header><div class="logo">Z-BrD DeV<span>GESTION PRO • 22 MÉTIERS</span></div><div class="sp"></div><button class="hbtn gold" onclick="setLang('fr')">FR</button><button class="hbtn gold" onclick="setLang('darija')">Darija</button><button class="hbtn white" onclick="show('home')">🏠 Accueil</button></header>
<div class="wrap">
<div class="admin"><button onclick="document.getElementById('adminBox').style.display='block'">⚙️ Admin</button></div>
<div class="card" id="adminBox" style="display:none;border:2px solid #f5c518"><h3 style="margin:0">🔗 Connexion Serveur - Admin</h3><p class="muted">Déjà connecté. Ne partagez pas ces clés.</p><label>URL Supabase</label><input id="inUrl"><label>Publishable Key</label><input id="inKey"><div class="row"><button class="btn gold" onclick="saveSupa()">Connecter ✅</button><button class="btn light" onclick="testSupa()">Tester</button></div><p id="supaMsg"></p></div>
<div id="content"></div>
</div>
<div id="devModal" class="modal"><div><h3 style="margin:0">Accès Développeur</h3><p id="devState">Première connexion - Créez votre mot de passe</p><label>Login</label><input id="devLogin" value="Z-BrD DeV"><label>Mot de passe</label><div style="position:relative"><input id="devPass" type="password"><button style="position:absolute;right:10px;top:14px;border:0;background:none;font-size:18px" onclick="let i=document.getElementById('devPass');i.type=i.type==='password'?'text':'password';this.innerText=i.type==='password'?'👁️':'🙈'">👁️</button></div><div class="row"><button class="btn gold" onclick="devEnter()">Entrer</button><button class="btn light" onclick="closeDev()">Fermer</button></div><button class="btn light" onclick="devReset()">Mot de passe oublié ? Réinitialiser</button><p id="devMsg" style="color:#b42318"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb=null; try{let u=localStorage.getItem('gp-supa-url'),k=localStorage.getItem('gp-supa-key'); if(u&&k) sb=window.supabase.createClient(u,k);}catch(e){}
function saveSupa(){let u=document.getElementById('inUrl').value.trim().replace(/\[|\]/g,'').replace('/rest/v1/',''),k=document.getElementById('inKey').value.trim(); if(!u||!k){document.getElementById('supaMsg').innerText='Khass URL w Key.';return;} localStorage.setItem('gp-supa-url',u); localStorage.setItem('gp-supa-key',k); try{sb=window.supabase.createClient(u,k);}catch(e){} document.getElementById('supaMsg').innerText='Tsejlat ✅'; alert('Bravo! Connecté ✅');}
function testSupa(){document.getElementById('supaMsg').innerText=localStorage.getItem('gp-supa-url')?'Connexion OK ✅':'Ba9i ma colliti walo.'}
setTimeout(()=>{let u=localStorage.getItem('gp-supa-url'),k=localStorage.getItem('gp-supa-key'); if(u)document.getElementById('inUrl').value=u; if(k)document.getElementById('inKey').value=k;},300);
const METIERS=["Pièces Auto + Vidange","Lavage Auto + Moteur","Coiffure Homme","Coiffure Femme / Esthétique","Hanout / Épicerie","Snack / Café / Pâtisserie","Boutique Vêtements","Électricien / Plombier / Climatisation","Mécanique Générale","Salle de Sport","Pharmacie","Librairie","Boulangerie / Pâtisserie","Boucherie / Poissonnerie","Bijouterie","Papeterie / Imprimerie / Cyber","Pressing / Lavage Tapis","Location Voitures","Agence Voyage","Immobilier","Événementiel / Traiteur","Réparation Téléphones / Informatique"];
const PRESET={"Pièces Auto + Vidange":{p:["Filtre à huile","Filtre à air","Plaquettes frein","Bougie","Batterie"],s:["Vidange complète","Changement filtre","Diagnostic"]},"Lavage Auto + Moteur":{p:["Shampooing","Cire","Produit moteur"],s:["Lavage Extérieur","Lavage Intérieur","Lavage Complet","Lavage Moteur Complet"]},"Coiffure Homme":{p:["Shampooing","Gel","Cire coiffante"],s:["Coupe Homme","Rasage","Coupe + Rasage"]},"Coiffure Femme / Esthétique":{p:["Shampooing","Masque","Vernis"],s:["Coupe Femme","Brushing","Manucure","Épilation"]},"Hanout / Épicerie":{p:["Huile","Sucre","Farine","Thé","Café","Lait"],s:["Livraison Hanout"]},"Snack / Café / Pâtisserie":{p:["Café","Thé","Jus","Pain","Gâteau"],s:["Petit-déjeuner","Déjeuner","Dîner"]},"Boutique Vêtements":{p:["T-shirt","Pantalon","Robe","Veste","Chaussures"],s:["Retouche"]},"Électricien / Plombier / Climatisation":{p:["Câble","Prise","Interrupteur","Tuyau","Robinet"],s:["Installation","Réparation","Dépannage"]}};
let state=JSON.parse(localStorage.getItem("gp-clean")||"null")||{produits:[],services:[],clients:[{nom:"Exemple",prenom:"Client",ville:"Casablanca",cin:"123456",tel:"0600000000",metier:METIERS[0],statut:"Essai"}],ventes:[],reservations:[],erreurs:[]};
function save(){localStorage.setItem("gp-clean",JSON.stringify(state)); render();}
const PAGES=["home","produits","services","ventes","clients","reservations","licence","support","dev"];
let cur="home";
let clicks=0; document.querySelector(".logo").onclick=()=>{clicks++; if(clicks>=5){clicks=0; openDev();} setTimeout(()=>clicks=0,1500);};
function setLang(l){render();}
function show(p){cur=p; render(); window.scrollTo({top:0,behavior:'smooth'});}
function prev(){let i=PAGES.indexOf(cur); if(i>0) show(PAGES[i-1]);}
function next(){let i=PAGES.indexOf(cur); if(i<PAGES.length-1) show(PAGES[i+1]);}
function openDev(){document.getElementById("devModal").classList.add("open"); let has=!!localStorage.getItem("zbrd-dev-pass"); document.getElementById("devState").innerText=has?"Bienvenue - Entrez votre mot de passe":"Première connexion - Créez votre mot de passe";}
function closeDev(){document.getElementById("devModal").classList.remove("open");}
function devEnter(){let login=document.getElementById("devLogin").value.trim().toLowerCase(); let pass=document.getElementById("devPass").value.trim(); let saved=localStorage.getItem("zbrd-dev-pass"); if(login!=="z-brd dev"){document.getElementById("devMsg").innerText="Login incorrect."; return;} if(!saved){localStorage.setItem("zbrd-dev-pass",pass); alert("Mot de passe créé ✅"); closeDev(); show("dev"); return;} if(pass===saved){closeDev(); show("dev");} else document.getElementById("devMsg").innerText="Mot de passe incorrect.";}
function devReset(){if(confirm("Créer un nouveau mot de passe ?")){localStorage.removeItem("zbrd-dev-pass"); openDev();}}
function reportErr(type){let d=prompt("Chno l mochkil b debt? ("+type+")"); if(d===null) return; state.erreurs.push({type:type,desc:d,date:new Date().toLocaleDateString()}); save(); alert("✅ Signalement envoyé. Support ghadi y-jawbek. WhatsApp +212780717090"); if(sb){try{sb.from("erreurs").insert({type_erreur:type,description:d});}catch(e){}}}
function navRow(prevLabel,nextLabel){return `<div class="bottomnav"><button class="btn light" onclick="prev()">← ${prevLabel}</button><button class="btn dark" onclick="next()">${nextLabel} →</button></div>`;}
function render(){
 let m=document.getElementById("metierSel")?.value||METIERS[0];
 let preset=PRESET[m]||{p:["Produit 1","Produit 2","Produit 3"],s:["Service 1","Service 2"]};
 let total=state.ventes.reduce((a,b)=>a+(+b.total||0),0);
 let h="";
 if(cur==="home"){h=`
 <div class="hero"><span class="badge">✦ 22 MÉTIERS</span><span class="badge">🎁 7 JOURS ESSAI</span><h1>Gestion Pro<br>Tous les métiers</h1><p>Produits, Services, Ventes, Clients, Réservations, Licence.<br>Prix : le vendeur les saisit lui-même.</p><div class="row"><button class="btn gold" onclick="show('produits')">🛍️ Produits</button><button class="btn dark" onclick="show('ventes')">🧾 Nouvelle Vente</button></div></div>
 <div class="kpis"><div class="kpi"><b>${state.produits.length}</b><br><span>Produits</span></div><div class="kpi"><b>${state.services.length}</b><br><span>Services</span></div><div class="kpi"><b>${total} DH</b><br><span>Ventes</span></div></div>
 <div class="card"><label>Choisir métier</label><select id="metierSel" onchange="render()">${METIERS.map(x=>`<option ${x===m?"selected":""}>${x}</option>`).join("")}</select></div>
 <div class="grid2">
  <button class="bigbtn gold" onclick="show('produits')"><span class="ico">🛍️</span><span><b>Produits</b><span>Ouvrir la page →</span></span></button>
  <button class="bigbtn dark" onclick="show('services')"><span class="ico">🛠️</span><span><b>Services</b><span>Ouvrir la page →</span></span></button>
  <button class="bigbtn" onclick="show('ventes')"><span class="ico">🧾</span><span><b>Ventes</b><span>Ouvrir la page →</span></span></button>
  <button class="bigbtn" onclick="show('clients')"><span class="ico">👥</span><span><b>Clients</b><span>Ouvrir la page →</span></span></button>
  <button class="bigbtn" onclick="show('reservations')"><span class="ico">📅</span><span><b>Réservations</b><span>Ouvrir la page →</span></span></button>
  <button class="bigbtn" onclick="show('licence')"><span class="ico">🔑</span><span><b>Licence</b><span>Ouvrir la page →</span></span></button>
  <button class="bigbtn" onclick="show('support')"><span class="ico">🆘</span><span><b>Support</b><span>Ouvrir la page →</span></span></button>
  <button class="bigbtn" onclick="show('ventes')"><span class="ico">🧾</span><span><b>Nouvelle Vente</b><span>Ouvrir la page →</span></span></button>
 </div>
 <p style="text-align:center;color:#98a2b3;font-size:12px;margin-top:16px">Z-BrD DeV • gestion-pro-zbrd.vercel.app</p>`;}
 else if(cur==="produits"){h=`<h2 class="pagetitle">🛍️ Produits</h2><p class="pagesub">Métier : ${m} — Produits prêts, sans prix. Le vendeur saisit le prix.</p><div class="card"><label>Métier</label><select id="metierSel" onchange="render()">${METIERS.map(x=>`<option ${x===m?"selected":""}>${x}</option>`).join("")}</select>${preset.p.map((p,idx)=>`<div class="item"><span><b>${p}</b><br><span class="muted">Prix DH :</span> <input id="pp${idx}" type="number" placeholder="Ex: 150" style="width:110px;display:inline-block;margin:0"></span><button class="btn gold" onclick="addProd2('${p.replace(/'/g,"")}',${idx})">+ Ajouter</button></div>`).join("")}<h3>Mes produits (${state.produits.length})</h3>${state.produits.map((p,i)=>`<div class="item"><span><b>${p.nom}</b> — ${p.prix} DH</span><button class="btn red" onclick="delProd(${i})">Supprimer</button></div>`).join("")||"<p class='muted'>Aucun produit. Cliquez sur + Ajouter.</p>"}</div>${navRow("Accueil","Services")}`;}
 else if(cur==="services"){h=`<h2 class="pagetitle">🛠️ Services</h2><p class="pagesub">Métier : ${m} — Services prêts par métier.</p><div class="card"><label>Métier</label><select id="metierSel" onchange="render()">${METIERS.map(x=>`<option ${x===m?"selected":""}>${x}</option>`).join("")}</select>${preset.s.map((s,idx)=>`<div class="item"><span><b>${s}</b><br><span class="muted">Prix DH :</span> <input id="ps${idx}" type="number" placeholder="Ex: 150" style="width:110px;display:inline-block;margin:0"></span><button class="btn gold" onclick="addServ2('${s.replace(/'/g,"")}',${idx})">+ Ajouter</button></div>`).join("")}<h3>Mes services (${state.services.length})</h3>${state.services.map((s,i)=>`<div class="item"><span><b>${s.nom}</b> — ${s.prix} DH</span><button class="btn red" onclick="delServ(${i})">Supprimer</button></div>`).join("")||"<p class='muted'>Aucun service.</p>"}</div>${navRow("Produits","Ventes")}`;}
 else if(cur==="ventes"){h=`<h2 class="pagetitle">🧾 Ventes / Caisse</h2><p class="pagesub">Enregistrez chaque vente. Cash / WafaCash / Carte.</p><div class="card"><label>Total DH</label><input id="vTotal" type="number" placeholder="Ex: 250"><label>Paiement</label><select id="vPay"><option>Cash</option><option>WafaCash</option><option>Carte</option></select><button class="btn gold" onclick="addVente()">✅ Enregistrer vente</button><h3>Historique — Total ${total} DH</h3>${state.ventes.map(v=>`<div class="item"><span><b>${v.total} DH</b> — ${v.pay}</span><span class="muted">${v.date}</span></div>`).join("")||"<p class='muted'>Aucune vente.</p>"}</div>${navRow("Services","Clients")}`;}
 else if(cur==="clients"){h=`<h2 class="pagetitle">👥 Clients (${state.clients.length})</h2><p class="pagesub">Nom, Ville, CIN, Téléphone, Licence, Blocage.</p><div class="card"><div class="row"><input id="cNom" placeholder="Nom *"><input id="cPrenom" placeholder="Prénom"><input id="cVille" placeholder="Ville"><input id="cCin" placeholder="CIN *"><input id="cTel" placeholder="Téléphone"></div><button class="btn gold" onclick="addClient()">+ Ajouter client</button></div>${state.clients.map((c,i)=>`<div class="card"><b>${c.nom} ${c.prenom}</b><br><span class="muted">Ville: ${c.ville} • CIN: ${c.cin} • Tél: ${c.tel}</span><br><span class="tag ${c.statut==='Bloqué'?'block':c.statut==='Essai'?'warn':''}">${c.statut}</span><div class="row" style="margin-top:10px"><button class="btn gold" onclick="licenceFor(${i})">🔑 Code Licence</button><button class="btn light" onclick="resetClientPass(${i})">🔄 Mot de passe</button><button class="btn light" onclick="blockClient(${i})">🚫 Bloquer</button><button class="btn dark" onclick="contactClient(${i})">💬 WhatsApp</button></div><div id="lic${i}"></div></div>`).join("")}${navRow("Ventes","Réservations")}`;}
 else if(cur==="reservations"){h=`<h2 class="pagetitle">📅 Réservations</h2><p class="pagesub">Rendez-vous et suivi.</p><div class="card"><input id="rNom" placeholder="Nom client"><input id="rServ" placeholder="Service"><input id="rDate" type="date"><button class="btn gold" onclick="addRes()">+ Ajouter réservation</button>${state.reservations.map(r=>`<div class="item"><span><b>${r.nom}</b> — ${r.service} — ${r.date}</span><span class="tag">${r.statut}</span></div>`).join("")||"<p class='muted'>Aucune réservation.</p>"}</div>${navRow("Clients","Licence")}`;}
 else if(cur==="licence"){h=`<h2 class="pagetitle">🔑 Licence</h2><p class="pagesub">7 jours essai gratuit. Offres : 1 an + 2 mois / 3 ans + 6 mois / 5 ans / À vie. Paiement d'abord : Cash / WafaCash. Alerte 3 mois avant expiry.</p><div class="card"><input id="licCode" placeholder="Entrez Code Licence"><button class="btn gold" onclick="checkLic()">Activer</button><p id="licMsg"></p><div class="row"><button class="btn light" onclick="alert('Offre 1 an + 2 mois - Cash / WafaCash')">1 an + 2 mois</button><button class="btn light" onclick="alert('Offre 3 ans + 6 mois')">3 ans + 6 mois</button><button class="btn light" onclick="alert('Offre 5 ans')">5 ans</button><button class="btn light" onclick="alert('Offre À vie')">À vie</button></div></div>${navRow("Réservations","Support")}`;}
 else if(cur==="support"){h=`<h2 class="pagetitle">🆘 Support / Erreurs</h2><p class="pagesub">Décrivez le problème. On le règle. Bouton, Licence, Data, PC / Téléphone.</p><div class="card"><select id="errType"><option>Bouton</option><option>Licence</option><option>Data</option><option>Appareil PC / Téléphone</option><option>Maintenance</option></select><textarea id="errDesc" rows="3" placeholder="Décrivez le problème..."></textarea><button class="btn gold" onclick="sendErr()">Envoyer au support</button><div class="row" style="margin-top:10px"><button class="btn dark" onclick="window.open('https://wa.me/212780717090')">💬 WhatsApp Support</button><button class="btn light" onclick="window.open('tel:+212780717090')">📞 Appel Support</button></div><h3>Erreurs signalées (${state.erreurs.length})</h3>${state.erreurs.map(e=>`<div class="errbox"><b>${e.type}</b> — ${e.desc}<br><span class="muted">${e.date}</span></div>`).join("")||"<p class='muted'>Aucune erreur signalée.</p>"}</div>${navRow("Licence","Développeur")}`;}
 else if(cur==="dev"){h=`<h2 class="pagetitle">👨‍💻 Développeur</h2><p class="pagesub">PAGE DÉVELOPPEUR SEULE - 500 à 1000 clients • WhatsApp +212780717090 • Par métier, licences, blocages.</p><div class="card"><h3 style="margin:0">📊 Statistiques</h3><div class="kpis"><div class="kpi"><b>${state.clients.length}</b><br><span>Clients</span></div><div class="kpi"><b>${state.produits.length}</b><br><span>Produits</span></div><div class="kpi"><b>${total} DH</b><br><span>Ventes</span></div></div></div><div class="card"><h3 style="margin:0">22 Métiers — Cliquez sur un métier</h3><div class="row" style="margin-top:10px">${METIERS.map((mm,i)=>`<button class="btn light" onclick="devMetier(${i})">${mm}</button>`).join("")}</div><div id="devClients"></div></div><div class="card"><h3 style="margin:0">Tous les clients</h3>${state.clients.map((c,i)=>`<div class="item"><span><b>${c.nom} ${c.prenom}</b><br><span class="muted">${c.ville} • CIN: ${c.cin} • ${c.tel}<br>${c.metier} — ${c.statut}</span></span><span><button class="btn gold" onclick="licenceForDev(${i})">Licence</button> <button class="btn light" onclick="blockClient(${i});show('dev')">Bloquer</button></span></div>`).join("")}<div id="devLic"></div></div><div class="card"><h3 style="margin:0">Erreurs signalées (${state.erreurs.length})</h3>${state.erreurs.map(e=>`<div class="errbox"><b>${e.type}</b> — ${e.desc}</div>`).join("")||"<p class='muted'>Aucune erreur.</p>"}</div><div class="bottomnav"><button class="btn light" onclick="prev()">← Précédent</button><button class="btn dark" onclick="show('home')">🏠 Accueil</button></div>`;}
 document.getElementById("content").innerHTML=h;
}
function addProd(n){let p=document.getElementById("pp0")?.value; alert("Utilisez le champ Prix à côté du produit.");} function addProd2(n,idx){let p=document.getElementById("pp"+idx).value; if(!p){alert("Entrez le prix d\u2019abord"); return;} state.produits.push({nom:n,prix:p,stock:0}); save(); alert("Produit ajouté ✅");}
function delProd(i){state.produits.splice(i,1); save();}
function addServ2(n,idx){let p=document.getElementById("ps"+idx).value; if(!p){alert("Entrez le prix d\u2019abord"); return;} state.services.push({nom:n,prix:p}); save(); alert("Service ajouté ✅");}
function delServ(i){state.services.splice(i,1); save();}
function addVente(){let t=document.getElementById("vTotal").value; if(!t){alert("Entrez le total"); return;} state.ventes.push({total:+t,pay:document.getElementById("vPay").value,date:new Date().toLocaleDateString()}); save(); alert("Vente enregistrée ✅");}
function addClient(){let c={nom:document.getElementById("cNom").value,prenom:document.getElementById("cPrenom").value,ville:document.getElementById("cVille").value,cin:document.getElementById("cCin").value,tel:document.getElementById("cTel").value,metier:document.getElementById("metierSel")?.value||METIERS[0],statut:"Essai"}; if(!c.nom||!c.cin){alert("Nom et CIN obligatoires"); return;} state.clients.push(c); save(); alert("Client ajouté ✅");}
function addRes(){let r={nom:document.getElementById("rNom").value,service:document.getElementById("rServ").value,date:document.getElementById("rDate").value,statut:"En attente"}; if(!r.nom){alert("Nom obligatoire"); return;} state.reservations.push(r); save();}
function licenceFor(i){let c=state.clients[i]; let code="ZBRD-"+(c.nom||"").toUpperCase().slice(0,3)+"-"+(c.cin||"").slice(-4)+"-"+Math.floor(1000+Math.random()*9000); document.getElementById("lic"+i).innerHTML="<div class='item'><b>Code : "+code+"</b><button class='btn gold' onclick=\"navigator.clipboard.writeText('"+code+"');alert('Copié ✅')\">Copier</button></div>";}
function licenceForDev(i){let c=state.clients[i]; let code="ZBRD-"+(c.nom||"").toUpperCase().slice(0,3)+"-"+(c.cin||"").slice(-4)+"-"+Math.floor(1000+Math.random()*9000); document.getElementById("devLic").innerHTML="<div class='item'><b>"+c.nom+" - Code : "+code+"</b><button class='btn gold' onclick=\"navigator.clipboard.writeText('"+code+"');alert('Copié ✅')\">Copier</button></div>";}
function resetClientPass(i){let np="Temp"+Math.floor(1000+Math.random()*9000); alert("Nouveau mot de passe client : "+np);}
function blockClient(i){state.clients[i].statut=state.clients[i].statut==="Bloqué"?"Actif":"Bloqué"; save();}
function contactClient(i){let c=state.clients[i]; window.open("https://wa.me/212"+(c.tel||"").replace(/^0/,""));}
function checkLic(){let v=document.getElementById("licCode").value.trim(); if(!v){document.getElementById("licMsg").innerText="Entrez un code."; return;} document.getElementById("licMsg").innerText="Licence activée : "+v+" ✅";}
function sendErr(){let t=document.getElementById("errType").value; let d=document.getElementById("errDesc").value; if(!d){alert("Décrivez le problème"); return;} state.erreurs.push({type:t,desc:d,date:new Date().toLocaleDateString()}); save(); alert("Signalement envoyé ✅"); if(sb){try{sb.from("erreurs").insert({type_erreur:t,description:d});}catch(e){}}}
function devMetier(i){let mm=METIERS[i]; let list=state.clients.filter(c=>c.metier===mm); document.getElementById("devClients").innerHTML="<h4>"+mm+" - "+list.length+" clients</h4>"+(list.map(c=>`<div class="item"><span><b>${c.nom} ${c.prenom}</b><br><span class="muted">${c.ville} • CIN: ${c.cin} • ${c.tel}</span></span><span>${c.statut}</span></div>`).join("")||"<p class='muted'>Aucun client dans ce métier.</p>");}
render();
</script></body></html>
